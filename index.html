<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f8dce1" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#3d1019" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Study">
<title>Study</title>

<style>
/* Uma cor de destaque (--accent, escolhida em ⚙) gera todo o resto. */
:root{
  --accent:#b3132f; --on-accent:#fff; --acc-l:#b3132f;
  --accent-text:var(--acc-l);
  --bg:color-mix(in srgb,var(--accent) 5%,#f6f6f8);
  --ink:color-mix(in srgb,var(--accent) 12%,#141418);
  --muted:color-mix(in srgb,var(--accent) 14%,#666673);
  --line:color-mix(in srgb,var(--accent) 12%,#e3e3ea);
  --card:rgba(255,255,255,.66); --card-solid:#fff; --field:rgba(255,255,255,.92);
  --tint:color-mix(in srgb,var(--accent) 9%,#fff); --hl:color-mix(in srgb,var(--accent) 26%,#fff);
  --soft:color-mix(in srgb,var(--accent) 7%,#f1f1f4); --late:var(--accent-text);
  --glass:.46; --rim:.8; --blob:.30;
  --sans:"Manrope",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  --mono:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme:dark){:root{
  --accent-text:color-mix(in srgb,var(--accent) 62%,#fff);
  --bg:color-mix(in srgb,var(--accent) 9%,#0b0b0e); --ink:#f3f3f7; --muted:color-mix(in srgb,var(--accent) 16%,#a5a5b1);
  --line:rgba(255,255,255,.09); --card:rgba(255,255,255,.055); --card-solid:color-mix(in srgb,var(--accent) 8%,#17171c); --field:rgba(255,255,255,.07);
  --tint:color-mix(in srgb,var(--accent) 16%,#121216); --hl:color-mix(in srgb,var(--accent) 34%,#121216); --soft:rgba(255,255,255,.06);
  --glass:.2; --rim:.35; --blob:.38; color-scheme:dark;
}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0}
body{font-family:var(--sans);font-size:16px;line-height:1.45;color:var(--ink);background:var(--bg);min-height:100vh;min-height:100dvh;-webkit-font-smoothing:antialiased}
/* fundo: degradê orgânico desfocado + grão */
body::before{content:"";position:fixed;inset:-20vmax;z-index:-2;pointer-events:none;filter:blur(60px);opacity:var(--blob);
  background:radial-gradient(38vmax 30vmax at 18% 12%,var(--accent),transparent 70%),radial-gradient(30vmax 26vmax at 92% 30%,color-mix(in srgb,var(--accent) 55%,#fff),transparent 70%),radial-gradient(34vmax 30vmax at 60% 105%,color-mix(in srgb,var(--accent) 70%,#000),transparent 70%)}
body::after{content:"";position:fixed;inset:0;z-index:-1;pointer-events:none;opacity:.07;mix-blend-mode:overlay;
  background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='160' height='160'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='3' stitchTiles='stitch'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>")}
#app{max-width:600px;margin:0 auto;padding:calc(24px + env(safe-area-inset-top)) 18px calc(118px + env(safe-area-inset-bottom))}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent-text);outline-offset:2px}
.glassy,.card,.kpis>div,.seg,nav,.iconbtn,.chip{background:var(--card);-webkit-backdrop-filter:blur(18px) saturate(140%);backdrop-filter:blur(18px) saturate(140%);border:1px solid color-mix(in srgb,#fff 55%,var(--line))}
@media (prefers-color-scheme:dark){.glassy,.card,.kpis>div,.seg,nav,.iconbtn,.chip{border-color:var(--line)}}

/* ícones de vidro */
.gi{flex:none;display:block}
.gi .so{fill:var(--accent)}
.gi .gl{fill:color-mix(in srgb,var(--accent) 42%,#fff);fill-opacity:.62}
@media (prefers-color-scheme:dark){.gi .gl{fill:color-mix(in srgb,var(--accent) 55%,#fff);fill-opacity:.4}}
.gi .rim{fill:none;stroke:#fff;stroke-opacity:var(--rim);stroke-width:1}
.gi .dt{fill:none;stroke:#fff;stroke-width:2.6;stroke-linecap:round;stroke-linejoin:round}
.gi .dd{fill:#fff}

.top{display:flex;justify-content:space-between;align-items:center;gap:10px}
h1{margin:0;font-size:30px;font-weight:800;letter-spacing:-.035em;line-height:1.1;display:flex;align-items:center;gap:10px}
.sub{font-size:14px;color:var(--muted);margin-top:4px;font-weight:500}
.tools{display:flex;gap:8px;align-items:center;flex:none}
.iconbtn{flex:none;width:48px;height:48px;border-radius:16px;display:grid;place-items:center;padding:0}
.chip{height:48px;border-radius:99px;padding:0 14px 0 8px;display:flex;align-items:center;gap:6px;font-weight:700;color:var(--ink)}
.chip.run{background:var(--accent);border-color:transparent;color:var(--on-accent)}
.chip.run .gi .so{fill:var(--on-accent)} .chip.run .gi .dt{stroke:var(--accent)}
.chip .tm{font-family:var(--mono);font-size:15px}

.btn{min-height:50px;border-radius:16px;border:0;background:var(--ink);color:var(--bg);font-weight:700;padding:10px 18px;display:inline-flex;align-items:center;justify-content:center;gap:8px;letter-spacing:-.01em}
.btn.y,.btn.ok{background:var(--accent);color:var(--on-accent);box-shadow:0 8px 22px -10px var(--accent)}
.btn.ghost{background:var(--field);color:var(--ink);border:1px solid var(--line)}
.btn.red{background:var(--field);color:var(--late);border:1px solid var(--line)}
.btn.block{width:100%}
.btn.big{min-height:60px;font-size:17px;border-radius:18px}
.btn:disabled{opacity:.45}
a.btn{text-decoration:none}

.sec{display:flex;justify-content:space-between;align-items:baseline;margin:28px 4px 10px}
.sec h2{margin:0;font-size:18px;font-weight:800;letter-spacing:-.02em}
.sec span{font-size:14px;color:var(--muted);font-weight:600}
.card{border-radius:22px;padding:6px 16px;margin-bottom:12px}
.empty{text-align:center;color:var(--muted);padding:24px 8px}
.empty b{display:block;color:var(--ink);font-size:18px;font-weight:800;letter-spacing:-.02em;margin-bottom:4px}
.hero{display:flex;justify-content:center;margin:2px 0 10px}

.item{padding:16px 0;border-top:1px solid var(--line)}
.item:first-child{border-top:0}
.name{border:0;background:none;padding:0;text-align:left;font-size:17px;font-weight:700;color:var(--ink);overflow-wrap:anywhere;width:100%;letter-spacing:-.01em}
.meta{font-size:13px;color:var(--muted);margin-top:3px;display:flex;flex-wrap:wrap;gap:4px 10px;align-items:center;font-weight:500}
.tag{display:inline-flex;align-items:center;gap:6px}
.dot{width:9px;height:9px;border-radius:50%;display:inline-block;flex:none}
.late{color:var(--late);font-weight:700}
.two{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;margin-top:12px}
.two .btn{min-height:58px}
.bl{display:flex;flex-direction:column;align-items:center;line-height:1.2}
.bl small{font-weight:500;font-size:12px;opacity:.85}
.seg{display:grid;grid-template-columns:1fr 1fr;gap:4px;border-radius:16px;padding:4px;margin-top:20px}
.seg button{border:0;background:none;border-radius:12px;min-height:44px;font-weight:700;color:var(--muted)}
.seg button.on{background:var(--card-solid);color:var(--ink);box-shadow:0 2px 10px -4px #0003}
.legend{font-size:12.5px;color:var(--muted);margin:6px 4px}
.sec h2 .tag{font-size:18px}

.row{display:flex;align-items:center;gap:12px;padding:12px 0;border-top:1px solid var(--line);min-height:58px}
.row:first-child{border-top:0}
.row .grow{flex:1;min-width:0}
.row .name{font-size:16px;font-weight:600}
.steps{display:flex;gap:4px;flex:none}
.steps i{width:6px;height:15px;border-radius:4px;background:var(--line)}
.steps i.on{background:var(--accent)}
.how{list-style:none;padding:0;margin:16px 0 0;text-align:left}
.how li{display:flex;gap:12px;margin-bottom:12px;color:var(--ink)}
.how li b{flex:none;width:26px;height:26px;border-radius:50%;background:var(--accent);color:var(--on-accent);display:grid;place-items:center;font-size:13px;margin:0}
details.card summary{min-height:56px;display:flex;align-items:center;justify-content:space-between;font-weight:700;cursor:pointer;list-style:none}
details.card summary::-webkit-details-marker{display:none}
details.card summary::after{content:"›";font-size:22px;color:var(--muted);transition:transform .2s}
details.card[open] summary::after{transform:rotate(90deg)}
.banner{background:var(--tint);border:1px solid var(--hl);border-radius:16px;padding:12px 14px;font-size:14px;margin-top:16px}
.banner button{background:none;border:0;padding:0;font-weight:800;text-decoration:underline;color:var(--accent-text)}

/* barra de navegação flutuante de vidro */
nav{position:fixed;left:12px;right:12px;bottom:calc(10px + env(safe-area-inset-bottom));z-index:5;max-width:520px;margin:0 auto;border-radius:26px;padding:6px;box-shadow:0 14px 40px -18px #0006}
nav div{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:4px}
nav button{min-height:60px;border:0;background:none;border-radius:20px;font-size:12.5px;font-weight:700;color:var(--muted);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;position:relative}
nav button .gi{opacity:.55;filter:saturate(.4);transition:all .2s}
nav button.on{background:var(--tint);color:var(--accent-text)}
nav button.on .gi{opacity:1;filter:none}
nav .cnt{position:absolute;top:6px;left:calc(50% + 10px);min-width:19px;height:19px;border-radius:10px;background:var(--accent);color:var(--on-accent);font-size:11px;font-weight:800;display:grid;place-items:center;padding:0 5px;border:2px solid var(--card-solid)}

label.f{display:block;margin-bottom:14px}
label.f>span{display:block;font-size:13.5px;font-weight:700;color:var(--muted);margin-bottom:6px}
input[type=text],input[type=date],input[type=time],input[type=number],select,textarea{width:100%;border:1px solid var(--line);border-radius:14px;background:var(--field);padding:13px;font-size:16px;color:var(--ink)}
textarea{resize:vertical;min-height:90px}
.hint{font-size:13.5px;color:var(--muted);margin:-6px 0 14px}
dialog{border:1px solid var(--line);border-radius:26px;padding:22px;width:min(470px,calc(100vw - 24px));max-height:90vh;overflow:auto;background:var(--card-solid);color:var(--ink);box-shadow:0 30px 80px -20px #0007}
dialog::backdrop{background:color-mix(in srgb,var(--accent) 18%,#0008);-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px)}
dialog h2{margin:0 0 16px;font-size:21px;font-weight:800;letter-spacing:-.02em;overflow-wrap:anywhere}
.foot{display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap;margin-top:6px}
.foot.split{justify-content:space-between}
hr{border:0;border-top:1px solid var(--line);margin:20px 0}
.toast{position:fixed;left:50%;transform:translateX(-50%);top:calc(12px + env(safe-area-inset-top));background:var(--ink);color:var(--bg);border-radius:16px;font-size:15px;font-weight:600;z-index:30;width:max-content;max-width:calc(100vw - 32px);display:flex;align-items:center;gap:14px;padding:13px 18px;box-shadow:0 14px 34px -12px #0006}
.toast.act{padding:6px 6px 6px 18px}
.toast button{flex:none;min-height:42px;border:0;border-radius:11px;background:color-mix(in srgb,var(--bg) 18%,transparent);color:var(--bg);font-weight:800;padding:0 12px}

.clock{font-family:var(--mono);font-size:64px;font-weight:700;letter-spacing:-.03em;text-align:center;line-height:1;margin:6px 0 4px;color:var(--accent-text)}
.kpis{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin-top:10px}
.kpis div{border-radius:18px;padding:12px}
.kpis b{display:block;font-size:22px;font-weight:800;letter-spacing:-.02em;color:var(--accent-text)}
.kpis span{font-size:12.5px;color:var(--muted);font-weight:500}
.bars{display:flex;align-items:flex-end;gap:6px;height:100px;padding:12px 0 8px}
.bar{flex:1;height:100%;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;gap:3px}
.bar i{display:block;width:100%;max-width:28px;border-radius:9px 9px 4px 4px;background:linear-gradient(180deg,color-mix(in srgb,var(--accent) 70%,#fff),var(--accent))}
.bar i.z{background:var(--line)}
.bar em{font-style:normal;font-size:11px;color:var(--muted);min-height:14px;font-weight:600}
.bar small{font-size:11px;color:var(--muted);font-weight:600}
.subj{padding:16px 0;border-top:1px solid var(--line)}
.subj:first-child{border-top:0}
.subj .top2{display:flex;justify-content:space-between;align-items:center;gap:10px}
.pill{font-size:12px;font-weight:800;border-radius:99px;padding:4px 11px;white-space:nowrap}
.pill.bad{background:var(--accent);color:var(--on-accent)}
.pill.mid{background:var(--tint);color:var(--accent-text);border:1px solid var(--hl)}
.pill.good{background:var(--soft);color:var(--ink);border:1px solid var(--line)}
.pill.none{color:var(--muted)}
.meterbar{height:8px;border-radius:9px;background:var(--line);overflow:hidden;margin:10px 0 4px}
.meterbar i{display:block;height:100%;background:var(--accent);border-radius:9px}
.linkbtn{background:none;border:0;padding:10px 0;font-weight:700;color:var(--accent-text);text-decoration:underline;text-underline-offset:3px}
.lab{display:block;font-size:14px;font-weight:800;margin:0 0 4px}
.exp{width:38px;height:38px;border:0;background:none;color:var(--muted);font-size:22px;line-height:1;display:grid;place-items:center;padding:0;transition:transform .2s}
.exp.open{transform:rotate(90deg)}
.detail{margin-top:12px;padding:14px;border-radius:18px;background:var(--tint)}
.detail .lab{font-size:13px;color:var(--muted)}
.kpis.mini{margin-top:6px}
.kpis.mini div{padding:9px 10px;background:var(--card-solid);border:1px solid var(--line)}
.kpis.mini b{font-size:17px}
.days{margin-top:12px;display:flex;flex-direction:column;gap:7px}
.day{display:grid;grid-template-columns:38px 1fr auto;align-items:center;gap:8px;font-size:13px;font-weight:600}
.day .dn{color:var(--muted)}
.day.now .dn{font-weight:800;color:var(--ink)}
.dbar{height:8px;border-radius:9px;background:var(--card-solid);overflow:hidden}
.dbar i{display:block;height:100%;background:var(--accent);border-radius:9px}
.dv{color:var(--ink);white-space:nowrap}

/* paleta de cores */
.palette{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:10px;margin-top:4px}
.sw{position:relative;aspect-ratio:1;border:0;border-radius:50%;padding:0;background:var(--c);overflow:hidden;box-shadow:0 6px 14px -8px var(--c)}
.sw::after{content:"";position:absolute;left:38%;top:30%;width:70%;height:70%;border-radius:50%;background:rgba(255,255,255,.42);-webkit-backdrop-filter:blur(3px);backdrop-filter:blur(3px);border:1px solid rgba(255,255,255,.7)}
.sw.on{outline:3px solid var(--ink);outline-offset:3px}
.sw.on::before{content:"✓";position:absolute;inset:0;display:grid;place-items:center;z-index:1;color:#fff;font-weight:800;font-size:18px;text-shadow:0 1px 4px #0006}
.cname{margin:10px 0 0;font-weight:700;text-align:center}
.first{background:var(--tint);border:1px solid var(--hl);border-radius:18px;padding:14px 16px;margin-bottom:6px;display:flex;flex-direction:column;gap:2px}
.first .fl{font-size:12px;font-weight:800;text-transform:uppercase;letter-spacing:.06em;color:var(--accent-text)}
.first b{font-size:20px;font-weight:800;letter-spacing:-.02em;overflow-wrap:anywhere}
.pl{display:flex;gap:12px;align-items:center;padding:10px 2px;border-top:1px solid var(--line)}
.pl:first-of-type{border-top:0}
.pn{flex:none;width:26px;height:26px;border-radius:50%;background:var(--soft);border:1px solid var(--line);display:grid;place-items:center;font-size:13px;font-weight:800;color:var(--muted)}
.item.pulse{animation:pulse 1.6s ease}
@keyframes pulse{0%,100%{background:transparent}30%{background:var(--tint)}}
.toggle{display:flex;gap:12px;align-items:flex-start;cursor:pointer}
.toggle input{width:22px;height:22px;margin-top:2px;flex:none;accent-color:var(--accent)}
.toggle span{display:flex;flex-direction:column}
.toggle small{color:var(--muted);font-size:13px}
/* computador e tablet deitado: menu na lateral, conteúdo mais largo */
@media (min-width:900px){
  body{padding-left:264px}
  #app{max-width:780px;padding:40px 32px 48px;margin:0 auto}
  nav{left:20px;right:auto;top:20px;bottom:20px;width:224px;margin:0;border-radius:28px;padding:14px;display:flex;flex-direction:column}
  nav::before{content:"Study";display:block;font-weight:800;font-size:20px;letter-spacing:-.03em;padding:10px 12px 18px}
  nav div{display:flex;flex-direction:column;gap:6px}
  nav button{flex-direction:row;justify-content:flex-start;gap:12px;min-height:54px;padding:0 14px;font-size:15px}
  nav .cnt{position:static;margin-left:auto}
  .two .btn{min-height:52px}
  .toast{left:calc(50% + 122px)}
}
@media (min-width:1200px){ #app{max-width:820px} }
.inst{display:flex;align-items:center;gap:12px;margin-top:16px;padding:12px 14px;border-radius:20px;background:var(--tint);border:1px solid var(--hl);flex-wrap:wrap}
.inst .grow{flex:1;min-width:150px;display:flex;flex-direction:column}
.inst b{font-weight:800}
.inst span{font-size:13px;color:var(--muted)}
.inst .ib{display:flex;align-items:center;gap:4px}
.inst .btn{min-height:42px;padding:8px 16px;border-radius:14px}
.inst .x{border:0;background:none;color:var(--muted);font-weight:700;font-size:13px;padding:10px 6px}
</style>

<body>
<div id="app"></div>
<nav aria-label="Navegação"><div id="tabs"></div></nav>
<dialog id="dlg"></dialog>
<script>
"use strict";
/* ---------- datas ---------- */
const pad = n => String(n).padStart(2, "0");
const ymd = d => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
const today = () => ymd(new Date());
const pd = s => { const [y, m, d] = s.split("-").map(Number); return new Date(y, m - 1, d, 12); };
const addDays = (s, n) => { const d = pd(s); d.setDate(d.getDate() + n); return ymd(d); };
const utc = s => { const [y, m, d] = s.split("-").map(Number); return Date.UTC(y, m - 1, d); };
const diff = (a, b) => Math.round((utc(b) - utc(a)) / 864e5);
const isDate = s => typeof s === "string" && /^\d{4}-\d{2}-\d{2}$/.test(s) && ymd(pd(s)) === s;
const fmt = s => s.slice(8) + "/" + s.slice(5, 7);
const dayName = s => { const n = diff(today(), s); if (n === 0) return "Hoje"; if (n === 1) return "Amanhã";
  return pd(s).toLocaleDateString("pt-BR", { weekday: "long" }).replace(/^./, c => c.toUpperCase()) + ", " + fmt(s); };
const plural = (n, a, b) => `${n} ${n === 1 ? a : b}`;
const uid = () => Math.random().toString(36).slice(2, 9) + Date.now().toString(36).slice(-4);

/* ---------- algoritmo FSRS-5 (Free Spaced Repetition Scheduler, open source) ----------
   O mesmo usado pelo Anki. Cada assunto guarda:
   s = estabilidade (quantos dias a memória dura com 90% de chance de lembrar)
   d = dificuldade (1 fácil … 10 difícil), aprendida com os "Lembrei"/"Esqueci".
   "Lembrei" = Good (3), "Esqueci" = Again (1). Parâmetros padrão do FSRS-5. */
const W = [0.40255, 1.18385, 3.173, 15.69105, 7.1949, 0.5345, 1.4604, 0.0046, 1.54575, 0.1192, 1.01925, 1.9395, 0.11, 0.29605, 2.2698, 0.2315, 2.9898, 0.51655, 0.6621];
const DECAY = -0.5, FACTOR = 19 / 81, RETENTION = 0.9, MAX_IV = 365;
const clamp = (n, a, b) => Math.min(b, Math.max(a, n));
const recall = (t, s) => Math.pow(1 + FACTOR * t / s, DECAY);           // chance de lembrar depois de t dias
const intervalFor = s => clamp(Math.round(s / FACTOR * (Math.pow(RETENTION, 1 / DECAY) - 1)), 1, MAX_IV);
const D0 = g => clamp(W[4] - Math.exp(W[5] * (g - 1)) + 1, 1, 10);
function nextState(it, g, date) {

/* ---------- detalhes de um conteúdo ---------- */
